    <script>
      // Filter out benign Vite WebSocket closure notifications in preview iframes
      (function() {
        if (typeof window !== 'undefined') {
          var OrigWS = window.WebSocket;
          if (OrigWS) {
            window.WebSocket = function(url, protocols) {
              if (typeof url === 'string' && (url.includes('@vite') || url.includes('.run.app') || url.includes('.ai.studio'))) {
                var fake = {
                  readyState: 1,
                  send: function() {},
                  close: function() {},
                  addEventListener: function(type, fn) {
                    if (type === 'open') setTimeout(fn, 10);
                  },
                  removeEventListener: function() {},
                  onopen: null,
                  onmessage: null,
                  onerror: null,
                  onclose: null
                };
                setTimeout(function() {
                  if (typeof fake.onopen === 'function') fake.onopen({ type: 'open' });
                }, 10);
                return fake;
              }
              return new OrigWS(url, protocols);
            };
            window.WebSocket.prototype = OrigWS.prototype;
          }
          window.addEventListener('error', function(event) {
            if (event.message && (event.message.includes('WebSocket') || event.message.includes('vite'))) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          }, true);
          window.addEventListener('unhandledrejection', function(event) {
            var reason = event.reason && (event.reason.message || String(event.reason));
            if (reason && (reason.includes('WebSocket') || reason.includes('vite'))) {
              event.preventDefault();
            }
          });
        }
      })();
    </script>

  <body>

    <script type="module" src="/src/main.tsx"></script>
  </body>
